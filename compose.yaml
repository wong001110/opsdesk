services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: opsdesk
      POSTGRES_USER: opsdesk
      POSTGRES_PASSWORD: opsdesk-local
    volumes:
      - opsdesk-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsdesk -d opsdesk"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build:
      context: .
    environment:
      OPSDESK_DATABASE_URL: jdbc:postgresql://postgres:5432/opsdesk
      OPSDESK_DATABASE_USERNAME: opsdesk
      OPSDESK_DATABASE_PASSWORD: opsdesk-local
      OPSDESK_BOOTSTRAP_ENABLED: "true"
      OPSDESK_BOOTSTRAP_EMAIL: admin@opsdesk.local
      OPSDESK_BOOTSTRAP_DISPLAY_NAME: Local Admin
      OPSDESK_BOOTSTRAP_PASSWORD: ${OPSDESK_BOOTSTRAP_PASSWORD:?Set OPSDESK_BOOTSTRAP_PASSWORD for the local admin}
      OPSDESK_AI_LIVE_ENABLED: ${OPSDESK_AI_LIVE_ENABLED:-false}
      OPSDESK_DEEPSEEK_BASE_URL: ${OPSDESK_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      OPSDESK_DEEPSEEK_MODEL: ${OPSDESK_DEEPSEEK_MODEL:-deepseek-chat}
      OPSDESK_DEEPSEEK_CREDENTIAL_ENV: OPSDESK_DEEPSEEK_API_KEY
      OPSDESK_DEEPSEEK_API_KEY: ${OPSDESK_DEEPSEEK_API_KEY:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  opsdesk-postgres-data:
